port=5050
log_level=INFO
default_model=sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
max_workers=8

# Compute precision: auto, fp16, bf16, fp32.
# auto: CUDA -> bf16 when supported, otherwise fp16; CPU -> fp32.
precision=auto

# Prefer FlashAttention-2 + SentenceTransformers input unpadding on supported GPUs.
# If disabled, unavailable, or unsupported by the GPU/model, workers use PyTorch SDPA.
flash_attention=true

# Serving queue and dynamic microbatching.
max_queue_size=1024
max_batch_tokens=16384
max_batch_wait_ms=2

# CPU target worker count; default is 1.
# The Docker gpu target overrides this to 0 and rejects non-zero CPU workers.
cpu_workers=1

# Model startup and per-RPC safeguards.
worker_start_timeout_seconds=300
request_timeout_seconds=300

# Optional HMAC secret. Leave unset/empty to disable authentication.
# secret=change-me
