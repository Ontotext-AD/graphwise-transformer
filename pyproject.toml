[build-system]
requires = ["setuptools>=68", "wheel", "grpcio-tools==1.83.0", "protobuf==7.35.1"]
build-backend = "setuptools.build_meta"

[project]
name = "graphwise-transformer"
version = "1.0.0"
description = "gRPC server for SentenceTransformer models with admin management"
readme = "README.md"
authors = [{name = "Tomas Kovachev", email = "tomas.kovachev@graphwise.ai"}]
requires-python = ">=3.10"
dependencies = [
    "torch==2.9.1",
    "transformers==5.14.1",
    "sentence-transformers==5.6.1",
    "grpcio==1.83.0",
    "grpcio-tools==1.83.0",
    "numpy>=2.0,<3",
    "protobuf==7.35.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
]

[project.scripts]
graphwise-transformer = "graphwise_transformer.server:main"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
