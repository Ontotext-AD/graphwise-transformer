[build-system]
requires = ["setuptools>=68", "wheel", "grpcio-tools>=1.62"]
build-backend = "setuptools.build_meta"

[project]
name = "graphwise-transformer"
version = "1.0.0"
description = "gRPC server for SentenceTransformer models with admin management"
readme = "README.md"
authors = [{name = "Tomas Kovachev", email = "tomas.kovachev@graphwise.ai"}]
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.62",
    "grpcio-tools>=1.62",
    "sentence-transformers>=3.0.1",
    "numpy>=1.24",
    "protobuf>=4.25",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-asyncio>=0.23",
]

[project.scripts]
graphwise-transformer = "graphwise_transformer.server:main"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
